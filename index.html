<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bingo Card Generator</title>
    <meta
      name="description"
      content="Generate custom printable and playable bingo cards with randomized spaces and interactive daubing."
    />
    <meta property="og:title" content="Bingo Card Generator" />
    <meta
      property="og:description"
      content="Generate custom printable and playable bingo cards with randomized spaces and interactive daubing."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Poppins:wght@600;700&family=Montserrat:wght@600;700&family=Nunito:wght@600;700&family=Fredoka:wght@500;600&family=Playfair+Display:wght@700&family=Roboto+Slab:wght@600;700&family=Caveat:wght@600;700&family=Patrick+Hand&family=Permanent+Marker&family=Lobster&family=Pacifico&family=Bangers&family=Bebas+Neue&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      body {
        font-family: "Outfit", sans-serif;
        background: #f4f6f8;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 20px;
      }
      form {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        max-width: 600px;
        width: 100%;
        margin-bottom: 30px;
      }
      fieldset {
        border: none;
        padding: 0;
        margin: 0 0 20px 0;
      }
      legend {
        font-weight: 700;
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: #2c3e50;
      }
      label {
        font-weight: 600;
        margin-bottom: 5px;
        display: block;
      }
      input[type="text"],
      input[type="number"],
      textarea,
      select,
      input[type="color"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 15px;
        font-family: "Outfit", sans-serif;
        box-sizing: border-box;
      }
      input[type="color"] {
        padding: 0;
        height: 40px;
        cursor: pointer;
      }
      input[type="submit"],
      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        width: 100%;
        display: block;
      }
      input[type="submit"]:hover,
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
      }
      .icon-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: -5px 0 15px 0;
      }
      .icon-bank button {
        width: 40px;
        height: 40px;
        padding: 0;
        font-size: 22px;
        background: #f4f6f8;
        border: 1px solid #ccc;
      }
      .icon-bank button:hover {
        background: #e8e2f5;
      }
      .font-row {
        display: flex;
        gap: 12px;
      }
      .font-row label {
        flex: 1;
      }
      div.break {
        clear: both;
        page-break-after: always;
        break-after: page;
      }
      .card-container {
        display: flex;
        justify-content: center;
        width: 100%;
        page-break-inside: avoid;
      }
      table {
        background-color: white;
        border-collapse: collapse;
        margin-bottom: 2em;
        border: 4px solid #333;
        width: 100%;
        max-width: 680px;
        table-layout: fixed;
      }
      td,
      th {
        border: 2px solid #333;
        text-align: center;
      }
      th {
        color: white;
        height: 80px;
        font-size: 34px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      td {
        height: 110px;
        font-size: 17px;
        padding: 6px;
        font-weight: 600;
        overflow-wrap: break-word;
        cursor: pointer;
        user-select: none;
      }
      #footer {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #ccc;
        text-align: center;
        font-size: 0.9em;
        color: #7f8c8d;
      }

      .daub {
        background: radial-gradient(
          circle,
          rgba(231, 76, 60, 0.45) 0 45%,
          transparent 47%
        );
      }
    </style>
    <style type="text/css" media="print">
      h1,
      form,
      #footer {
        display: none;
      }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="text/javascript">
      /*jslint browser: true, devel: true */
      /* global $ */

      var dauber = {
        // If the target bingo card square has a daub, remove it. Otherwise, add a daub
        toggle: function (e) {
          "use strict";
          e.currentTarget.classList.toggle("daub");
        },

        // Iterate over any bingo cards on the page and attach mouse/touch events to each square
        init: function () {
          "use strict";
          var bingoSquare;
          var bingoSquares = document
            .getElementById("results")
            .getElementsByTagName("td");
          for (bingoSquare of bingoSquares) {
            bingoSquare.addEventListener("click", this.toggle);
          }
        },
      };

      var bingoGenerator = {
        // Given an array, return the array minus any empty elements
        removeEmptyElements: function (arr) {
          "use strict";
          var newArray = [],
            i = 0;
          for (i = 0; i < arr.length; i += 1) {
            if (arr[i]) {
              newArray.push(arr[i]);
            }
          }
          return newArray;
        },

        bingoCard: function (title, width, height, list) {
          "use strict";
          var possibleSpaces, spaces, i, j, output;
          list = bingoGenerator.escapeHTML(list);
          list = bingoGenerator.newlineToBR(list);
          possibleSpaces = bingoGenerator.removeEmptyElements(list.split(","));

          // Create a random selection of the possible values
          spaces = [];
          for (i = 0; i < width * height; i += 1) {
            spaces.push(
              possibleSpaces.splice(
                Math.floor(Math.random() * possibleSpaces.length),
                1,
              )[0],
            );
          }

          // Output
          var color = $("#headerColor").val() || "#000000";
          // Select values only, so they can't inject CSS
          var titleFont = $("#titleFont").val() || "Outfit";
          var bodyFont = $("#bodyFont").val() || "Outfit";
          output =
            "<div class=\"card-container\"><table style=\"font-family: '" +
            bodyFont +
            "', sans-serif;\"><thead><tr><th colspan=\"" +
            width +
            '" style="background-color: ' +
            color +
            "; font-family: '" +
            titleFont +
            "', sans-serif;\">" +
            title +
            "</th></tr></thead>";
          output += "<tbody>";
          for (i = 0; i < height; i += 1) {
            output += "<tr>";
            for (j = 0; j < width; j += 1) {
              output += "<td>" + spaces.shift() + "</td>";
            }
            output += "</tr>";
          }
          output += "</tbody></table></div>";
          $("#results").append(output);
        },

        // Generate Bingo Cards
        generate: function () {
          "use strict";
          var spaces, i;

          // Check to make sure enough options are provided to fill the bingo card spaces
          spaces = bingoGenerator.removeEmptyElements(
            $("#words").val().split(","),
          ).length;
          if (spaces < $("#width").val() * $("#height").val()) {
            alert(
              "Faltan canciones: hay " +
                spaces +
                " y el cartón necesita " +
                $("#width").val() * $("#height").val() +
                ".",
            );
            return false;
          }

          // Clear any previous results
          $("#results").html("");

          // Loop over number of cards requested
          for (i = 0; i < document.getElementById("number").value; i += 1) {
            // Create bingo card
            bingoGenerator.bingoCard(
              $("#title").val(),
              $("#width").val(),
              $("#height").val(),
              $("#words").val(),
            );
            if (i < document.getElementById("number").value - 1) {
              $("#results").append('<div class="break"></div>');
            }
          }

          // Jump to results
          location.href = "#results";
          return true;
        },

        // Replace + with spaces, <> with entities, and URL-decode &/,:;+=?%$@
        urlUnencode: function (str) {
          "use strict";
          return decodeURI(str)
            .replace(/</g, "&lt;")
            .replace(/\+/g, " ")
            .replace(/%24/g, "$")
            .replace(/%25/g, "%")
            .replace(/%26/g, "&")
            .replace(/%2B/g, "+")
            .replace(/%2C/g, ",")
            .replace(/%2F/g, "/")
            .replace(/%23/g, "#")
            .replace(/%3A/g, ":")
            .replace(/%3B/g, ";")
            .replace(/%3C/g, "&lt;")
            .replace(/%3D/g, "=")
            .replace(/%3F/g, "?")
            .replace(/%40/g, "@");
        },

        escapeHTML: function (str) {
          "use strict";
          return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        },

        newlineToBR: function (str) {
          "use strict";
          return str.replace(/\n/g, "<br>");
        },

        parseQS: function () {
          "use strict";
          var qsArray, json, i, kv, key, val;
          // Remove leading question mark ("?") and split into array of key/value pairs
          qsArray = location.search.slice(1).split("&");
          // Initialize object to store key/value pairs
          json = {};
          // Loop through key/value pairs and separate into keys and values
          for (i = 0; i < qsArray.length; i += 1) {
            kv = qsArray[i].split("=");
            key = kv[0];
            if (kv.length === 1) {
              val = key;
            } else {
              // A key may be present without a value, so set a placeholder value
              val = kv[1];
            }
            json[key] = val;
          }
          return json;
        },

        checkQS: function () {
          "use strict";
          var qs = bingoGenerator.parseQS();
          if (!(qs.title === undefined) || !(qs.words === undefined)) {
            if (!(qs.title === undefined)) {
              $("#title").val(bingoGenerator.urlUnencode(qs.title));
            }
            if (!(qs.words === undefined)) {
              $("#words").val(bingoGenerator.urlUnencode(qs.words));
            }
            if (!(qs.headerColor === undefined)) {
              $("#headerColor").val(bingoGenerator.urlUnencode(qs.headerColor));
            }
            if (!(qs.titleFont === undefined)) {
              $("#titleFont").val(bingoGenerator.urlUnencode(qs.titleFont));
            }
            if (!(qs.bodyFont === undefined)) {
              $("#bodyFont").val(bingoGenerator.urlUnencode(qs.bodyFont));
            }
            if (!(qs.width === undefined)) {
              $("#width").val(qs.width);
            }
            if (!(qs.height === undefined)) {
              $("#height").val(qs.height);
            }
            if (!(qs.number === undefined)) {
              $("#number").val(qs.number);
            }
          }
          if (
            !(qs.title === undefined) &&
            !(qs.words === undefined) &&
            bingoGenerator.generate()
          ) {
            dauber.init();
            $("#downloadPdfBtn")
              .show()
              .click(function (e) {
                e.preventDefault();
                bingoGenerator.downloadPdf(this);
              });
          }
        },

        // One card per A4 page. Each card is rendered on its own canvas, so large
        // batches don't exceed the browser's max canvas size.
        downloadPdf: function (button) {
          "use strict";
          var cards = document.querySelectorAll("#results .card-container");
          var opt = {
            margin: 10,
            filename: "bingo.pdf",
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, scrollX: 0, scrollY: 0 },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          };
          button.disabled = true;
          button.textContent = "Generando PDF...";
          // Wait for the web fonts, or html2canvas renders the fallback font
          document.fonts.ready.then(function () {
            var worker = html2pdf().set(opt).from(cards[0]).toPdf();
            var i;
            for (i = 1; i < cards.length; i += 1) {
              worker = worker
                .get("pdf")
                .then(function (pdf) {
                  pdf.addPage();
                })
                .from(cards[i])
                .toContainer()
                .toCanvas()
                .toPdf();
            }
            return worker.save();
          }).then(function () {
            button.disabled = false;
            button.textContent = "Descargar PDF";
          });
        },

        fonts: [
          "Outfit",
          "Poppins",
          "Montserrat",
          "Nunito",
          "Fredoka",
          "Playfair Display",
          "Roboto Slab",
          "Caveat",
          "Patrick Hand",
          "Permanent Marker",
          "Lobster",
          "Pacifico",
          "Bangers",
          "Bebas Neue",
          "Righteous",
        ],

        icons: "🎵 🎶 🎤 🎧 🎸 🎹 🥁 🎷 🎺 🎻 💿 📻 ⭐ ✨ 🎉 🎈 🏆 ❤️ 🎄 🎃".split(" "),

        initControls: function () {
          "use strict";
          bingoGenerator.fonts.forEach(function (font) {
            $("#titleFont, #bodyFont").append(
              $("<option>").val(font).text(font).css("font-family", font),
            );
          });
          bingoGenerator.icons.forEach(function (icon) {
            $("#iconBank").append(
              $('<button type="button">').text(icon).attr("title", "Añadir " + icon),
            );
          });
          // Insert the icon at the cursor position of the title field
          $("#iconBank").on("click", "button", function () {
            var input = document.getElementById("title");
            var start = input.selectionStart;
            var end = input.selectionEnd;
            var icon = $(this).text();
            input.value =
              input.value.slice(0, start) + icon + input.value.slice(end);
            input.focus();
            input.setSelectionRange(start + icon.length, start + icon.length);
          });
        },
      };

      $(document).ready(function () {
        bingoGenerator.initControls();
        bingoGenerator.checkQS();
      });
    </script>
  </head>
  <body>
    <h1>Crea tu propio Bingo</h1>
    <form action="#results" method="get">
      <fieldset>
        <legend>Detalles del bingo</legend>
        <label
          >Título:<input
            type="text"
            name="title"
            id="title"
            value="Título bingo"
        /></label>
        <div class="icon-bank" id="iconBank"></div>
        <div class="font-row">
          <label
            >Fuente del título:<select name="titleFont" id="titleFont"></select
          ></label>
          <label
            >Fuente de las casillas:<select name="bodyFont" id="bodyFont"></select
          ></label>
        </div>
        <label
          >Color de cabecera:<input
            type="color"
            name="headerColor"
            id="headerColor"
            value="#000000"
        /></label>
        <label>Listado de canciones (separadas por comas):</label
        ><textarea cols="60" rows="8" name="words" id="words">...</textarea>
        <label
          >Número de cuadrados a lo ancho:
          <input type="number" min="1" max="10" name="width" id="width" value="5"
        /></label>
        <label
          >Número de cuadrados a lo alto:
          <input type="number" min="1" max="10" name="height" id="height" value="5"
        /></label>
        <label
          >Número de cartones a imprimir:
          <input type="number" min="1" max="200" name="number" id="number" value="10"
        /></label>
      </fieldset>
      <label><input type="submit" value="Generar bingo" /></label>
      <label
        ><button
          type="button"
          id="downloadPdfBtn"
          style="display: none; margin-top: 10px"
        >
          Descargar PDF
        </button></label
      >
    </form>

    <div id="results"></div>

    <div id="footer">
      Basado en el código de <a href="https://osric.com/">Chris Osric</a>
    </div>
  </body>
</html>
