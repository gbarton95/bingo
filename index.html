<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bingo Card Generator</title>
    <meta
      name="description"
      content="Generate custom printable and playable bingo cards with randomized spaces and interactive daubing."
    />
    <meta property="og:title" content="Bingo Card Generator" />
    <meta
      property="og:description"
      content="Generate custom printable and playable bingo cards with randomized spaces and interactive daubing."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      body {
        font-family: "Outfit", sans-serif;
        background: #f4f6f8;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 20px;
      }
      form {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        max-width: 600px;
        width: 100%;
        margin-bottom: 30px;
      }
      fieldset {
        border: none;
        padding: 0;
        margin: 0 0 20px 0;
      }
      legend {
        font-weight: 700;
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: #2c3e50;
      }
      label {
        font-weight: 600;
        margin-bottom: 5px;
        display: block;
      }
      input[type="text"],
      textarea,
      input[type="color"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 15px;
        font-family: "Outfit", sans-serif;
        box-sizing: border-box;
      }
      input[type="color"] {
        padding: 0;
        height: 40px;
        cursor: pointer;
      }
      input[type="submit"],
      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        width: 100%;
        display: block;
      }
      input[type="submit"]:hover,
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
      }
      div.break {
        clear: both;
        page-break-after: always;
        break-after: page;
      }
      .card-container {
        display: flex;
        justify-content: center;
        width: 100%;
        page-break-inside: avoid;
      }
      table {
        background-color: white;
        border-collapse: collapse;
        margin-bottom: 2em;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        border: 4px solid #333;
      }
      td,
      th {
        border: 2px solid #333;
        text-align: center;
      }
      th {
        color: white;
        height: 60px;
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      td {
        width: 90px;
        height: 90px;
        font-size: 14px;
        padding: 5px;
        font-weight: 600;
      }
      #footer {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #ccc;
        text-align: center;
        font-size: 0.9em;
        color: #7f8c8d;
      }

      .daub {
        background-repeat: no-repeat;
      }
      .daubPos1 {
        background-position: 8px 8px;
      }
      .daubPos2 {
        background-position: 3px 8px;
      }
      .daubPos3 {
        background-position: 8px 3px;
      }
      .daubPos4 {
        background-position: 12px 8px;
      }
      .daubPos5 {
        background-position: 8px 12px;
      }
      .daubImg1 {
        background-image: url(images/daub1.png);
      }
      .daubImg2 {
        background-image: url(images/daub2.png);
      }
      .daubImg3 {
        background-image: url(images/daub3.png);
      }
      .daubImg4 {
        background-image: url(images/daub4.png);
      }
      .daubImg5 {
        background-image: url(images/daub5.png);
      }
    </style>
    <style type="text/css" media="print">
      h1,
      form,
      #footer {
        display: none;
      }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="text/javascript">
      /*jslint browser: true, devel: true */
      /* global $ */

      var dauber = {
        // If the target bingo card square has a daub, remove it. Otherwise, add a daub
        toggle: function (e) {
          "use strict";
          var i;
          var target = e.currentTarget;
          if (target.classList.contains("daub")) {
            for (i = 1; i <= 5; i = i + 1) {
              target.classList.remove("daubImg" + i);
              target.classList.remove("daubPos" + i);
            }
            target.classList.remove("daub");
          } else {
            target.classList.add("daub");
            target.classList.add("daubPos" + Math.ceil(Math.random() * 5));
            target.classList.add("daubImg" + Math.ceil(Math.random() * 5));
          }
        },

        // Iterate over any bingo cards on the page and attach mouse/touch events to each square
        init: function () {
          "use strict";
          var bingoSquare;
          var bingoSquares = document
            .getElementById("results")
            .getElementsByTagName("td");
          for (bingoSquare of bingoSquares) {
            bingoSquare.addEventListener("mousedown", this.toggle);
          }
        },
      };

      var bingoGenerator = {
        pageBreaks: "on", // automatically inserts a page break after every 2 cards

        // Given an array, return the array minus any empty elements
        removeEmptyElements: function (arr) {
          "use strict";
          var newArray = [],
            i = 0;
          for (i = 0; i < arr.length; i += 1) {
            if (arr[i]) {
              newArray.push(arr[i]);
            }
          }
          return newArray;
        },

        formatFreespace: function (str, subheading) {
          "use strict";
          return (
            "<strong>" +
            str +
            '<div class="freespace">' +
            subheading +
            "</div></strong>"
          );
        },

        bingoCard: function (
          title,
          width,
          height,
          freespace,
          freespaceValue,
          freespaceSubheadingValue,
          freespaceRandom,
          list,
        ) {
          "use strict";
          var possibleSpaces, enoughSpaces, spaces, centerSquare, i, j, output;
          list = bingoGenerator.escapeHTML(list);
          list = bingoGenerator.newlineToBR(list);
          possibleSpaces = bingoGenerator.removeEmptyElements(list.split(","));

          // Two options for including random Free Space:
          // Option 1: We don't have enough. Include in random placement.
          // Option 2:- We have enough. Overwrite other option.
          enoughSpaces = true;
          if (possibleSpaces.length < width * height) {
            enoughSpaces = false;
          }

          // Option 1
          if (
            freespace === "true" &&
            freespaceRandom === "true" &&
            !enoughSpaces
          ) {
            possibleSpaces.push(
              bingoGenerator.formatFreespace(
                freespaceValue,
                freespaceSubheadingValue,
              ),
            );
          }

          // Create a random selection of the possible values
          spaces = [];

          // This works for squares with odd dimensions,, e.g. 3x3 or 5x5, but not for even squares or rectangles
          // var centerSquare = Math.floor(width*height/2);
          // We'll say center is the center row of the center column
          centerSquare = Math.floor(height / 2) * width + Math.floor(width / 2);

          for (i = 0; i <= width * height; i += 1) {
            if (
              i === centerSquare &&
              freespace === "true" &&
              freespaceRandom === "false"
            ) {
              spaces.push(
                bingoGenerator.formatFreespace(
                  freespaceValue,
                  freespaceSubheadingValue,
                ),
              );
            } else {
              spaces.push(
                possibleSpaces.splice(
                  Math.floor(Math.random() * possibleSpaces.length),
                  1,
                )[0],
              );
            }
          }

          // Option 2
          if (
            freespace === "true" &&
            freespaceRandom === "true" &&
            enoughSpaces
          ) {
            spaces[Math.floor(Math.random() * spaces.length)] =
              bingoGenerator.formatFreespace(
                freespaceValue,
                freespaceSubheadingValue,
              );
          }

          // Output
          var color = $("#headerColor").val() || "#000000";
          output =
            '<div class="card-container"><table><thead><tr><th colspan="' +
            width +
            '" style="background-color: ' +
            color +
            ';">' +
            title +
            "</th></tr></thead>";
          output += "<tbody>";
          for (i = 0; i < height; i += 1) {
            output += "<tr>";
            for (j = 0; j < width; j += 1) {
              output += "<td>" + spaces.shift() + "</td>";
            }
            output += "</tr>";
          }
          output += "</tbody></table></div>";
          $("#results").append(output);
        },

        // Generate Bingo Cards
        generate: function () {
          "use strict";
          var colsFilled, rowsFilled, spaces, i;

          // Check to make sure enough options are provided to fill the bingo card spaces
          spaces = bingoGenerator.removeEmptyElements(
            $("#words").val().split(","),
          ).length;
          if ($("#freespace").val()) {
            spaces += 1;
          }
          if (spaces < $("#width").val() * $("#height").val()) {
            alert(
              "Warning: you do not have enough possible board options for the size of the board you selected!",
            );
          }

          // Clear any previous results
          $("#results").html("");

          // Try to make nice printable pages -- we can fit about 10 pieces across and 6 down
          colsFilled = 0;
          rowsFilled = 1;

          // Loop over number of cards requested
          for (i = 0; i < document.getElementById("number").value; i += 1) {
            // Create bingo card
            bingoGenerator.bingoCard(
              $("#title").val(),
              $("#width").val(),
              $("#height").val(),
              $("#freespace").val(),
              $("#freespaceValue").val(),
              $("#freespaceSubheadingValue").val(),
              $("#freespaceRandom").val(),
              $("#words").val(),
            );
            if (i < document.getElementById("number").value - 1) {
              $("#results").append('<div class="break"></div>');
            }
          }

          // Jump to results
          location.href = "#results";
        },

        // Replace + with spaces, <> with entities, and URL-decode &/,:;+=?%$@
        urlUnencode: function (str) {
          "use strict";
          return decodeURI(str)
            .replace(/</g, "&lt;")
            .replace(/\+/g, " ")
            .replace(/%24/g, "$")
            .replace(/%25/g, "%")
            .replace(/%26/g, "&")
            .replace(/%2B/g, "+")
            .replace(/%2C/g, ",")
            .replace(/%2F/g, "/")
            .replace(/%3A/g, ":")
            .replace(/%3B/g, ";")
            .replace(/%3C/g, "&lt;")
            .replace(/%3D/g, "=")
            .replace(/%3F/g, "?")
            .replace(/%40/g, "@");
        },

        escapeHTML: function (str) {
          "use strict";
          return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        },

        newlineToBR: function (str) {
          "use strict";
          return str.replace(/\n/g, "<br>");
        },

        parseQS: function () {
          "use strict";
          var qsArray, json, i, kv, key, val;
          // Remove leading question mark ("?") and split into array of key/value pairs
          qsArray = location.search.slice(1).split("&");
          // Initialize object to store key/value pairs
          json = {};
          // Loop through key/value pairs and separate into keys and values
          for (i = 0; i < qsArray.length; i += 1) {
            kv = qsArray[i].split("=");
            key = kv[0];
            if (kv.length === 1) {
              val = key;
            } else {
              // A key may be present without a value, so set a placeholder value
              val = kv[1];
            }
            json[key] = val;
          }
          return json;
        },

        checkQS: function () {
          "use strict";
          var qs = bingoGenerator.parseQS();
          if (!(qs.title === undefined) || !(qs.words === undefined)) {
            $("#intro").hide();
            if (!(qs.title === undefined)) {
              $("#title").val(bingoGenerator.urlUnencode(qs.title));
            }
            if (!(qs.words === undefined)) {
              $("#words").val(bingoGenerator.urlUnencode(qs.words));
            }
            if (!(qs.headerColor === undefined)) {
              $("#headerColor").val(bingoGenerator.urlUnencode(qs.headerColor));
            }
            if (!(qs.freespace === undefined || qs.freespace === "false")) {
              var fSpace = document.getElementById("freespace");
              if (fSpace) fSpace.selectedIndex = 0;
              $("#freespaceValue").val(
                bingoGenerator.urlUnencode(qs.freespaceValue || ""),
              );
              if (!(qs.freespaceSubheadingValue === undefined)) {
                $("#freespaceSubheadingValue").val(
                  bingoGenerator.urlUnencode(qs.freespaceSubheadingValue),
                );
              } else {
                $("#freespaceSubheadingValue").val("Free Space");
              }
              if (
                !(qs.freespaceRandom === undefined) &&
                qs.freespaceRandom === "true"
              ) {
                var fSpaceRandom = document.getElementById("freespaceRandom");
                if (fSpaceRandom) fSpaceRandom.selectedIndex = 0;
              }
            } else {
              var fSpace = document.getElementById("freespace");
              if (fSpace) fSpace.selectedIndex = 1;
              $("#freespaceValue").val("");
            }
            if (!(qs.width === undefined)) {
              $("#width").val(qs.width);
            }
            if (!(qs.height === undefined)) {
              $("#height").val(qs.height);
            }
            if (!(qs.number === undefined)) {
              $("#number").val(qs.number);
            }
          }
          if (!(qs.pageBreaks === undefined)) {
            bingoGenerator.pageBreaks = qs.pageBreaks;
          }
          if (qs.onlyCard === "true") {
            $("#number").val(1);
            $("h1").hide();
            $("form").hide();
            $("#footer").hide();
            $("body").css("margin", 0);
            $("table").css("margin", 0);
          }
          if (!(qs.title === undefined) && !(qs.words === undefined)) {
            bingoGenerator.generate();
            dauber.init();
            $("#downloadPdfBtn")
              .show()
              .click(function (e) {
                e.preventDefault();
                var element = document.getElementById("results");
                var opt = {
                  margin: 0.5,
                  filename: "bingo.pdf",
                  image: { type: "jpeg", quality: 0.98 },
                  html2canvas: { scale: 2 },
                  jsPDF: {
                    unit: "in",
                    format: "letter",
                    orientation: "portrait",
                  },
                  pagebreak: { mode: ["css", "legacy"] },
                };
                html2pdf().set(opt).from(element).save();
              });
          }
        },
      };

      $(document).ready(bingoGenerator.checkQS);
    </script>
  </head>
  <body>
    <h1>Crea tu propio Bingo</h1>
    <form action="#results" method="get">
      <!-- onsubmit="generate();return false;" -->
      <fieldset>
        <legend>Detalles del bingo</legend>
        <label
          >Título:<input
            type="text"
            name="title"
            id="title"
            value="Título bingo"
        /></label>
        <label
          >Color de cabecera:<input
            type="color"
            name="headerColor"
            id="headerColor"
            value="#000000"
        /></label>
        <label>Listado de canciones (separadas por comas):</label
        ><textarea cols="60" rows="8" name="words" id="words">...</textarea>
        <label
          >Número de cuadrados a lo ancho:
          <input type="text" name="width" id="width" value="5"
        /></label>
        <label
          >Número de cuadrados a lo alto:
          <input type="text" name="height" id="height" value="5"
        /></label>
        <label
          >Número de cartones a imprimir:
          <input type="text" name="number" id="number" value="10"
        /></label>
      </fieldset>
      <label><input type="submit" value="Generar bingo" /></label>
      <label
        ><button
          type="button"
          id="downloadPdfBtn"
          style="display: none; margin-top: 10px"
        >
          Descargar PDF
        </button></label
      >
    </form>

    <div id="results"></div>

    <div id="footer">
      Basado en el código de <a href="https://osric.com/">Chris Osric</a>
    </div>
  </body>
</html>
