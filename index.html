    <style type="text/css">

      div.break {

      .card-container {

      .card-wrapper {

      .card-wrapper table {

        border-collapse: collapse;

        margin-bottom: 0;
        box-shadow: none;
        position: relative;
      }
      .card-watermark {
        position: absolute;
        top: 66px;
        left: 0;
        width: 100%;
        height: calc(100% - 66px);

        pointer-events: none;
        z-index: 3;

      /* Red ink daub marker */

      @media print {

        }

        }
        .card-container {
          margin-bottom: 0;
          padding: 10mm 0;
        }
        .card-wrapper {
          box-shadow: none;
        }
        table {

          border-color: #000;
          max-width: 100%;
        }

        }
        td.blank-square {

        }
        .card-watermark {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;

    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="text/javascript">
      /*jslint browser: true, devel: true */
      /* global $ */

      var dauber = {
        // Toggle daub marker on playable bingo cells only
        toggle: function (e) {
          "use strict";
          if (e.currentTarget.classList.contains("blank-square")) {
            return;
          }
          e.currentTarget.classList.toggle("daub");
        },

        clearAll: function () {
          "use strict";
          $("#results td.daub").removeClass("daub");
        },

        init: function () {
          "use strict";
          var bingoSquares = document
            .getElementById("results")
            .getElementsByClassName("bingo-cell");
          for (var i = 0; i < bingoSquares.length; i += 1) {
            bingoSquares[i].removeEventListener("click", dauber.toggle);
            bingoSquares[i].addEventListener("click", dauber.toggle);
            bingoSquares[i].addEventListener("keydown", function (e) {
              if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                e.currentTarget.classList.toggle("daub");
              }
            });
          }
        },
      };

      var bingoGenerator = {
        bgImageData: "/spiderweb.svg",
        bgImageName: "Telaraña (Halloween)",

        sampleSongs: [
          "Despacito - Luis Fonsi",
          "Bailando - Enrique Iglesias",
          "La Bicicleta - Carlos Vives & Shakira",
          "Danza Kuduro - Don Omar",
          "Vivir Mi Vida - Marc Anthony",
          "Gasolina - Daddy Yankee",
          "Macarena - Los del Río",
          "Aserejé - Las Ketchup",
          "Corazón Partío - Alejandro Sanz",
          "La Bamba - Los Lobos",
          "Rayando el Sol - Maná",
          "La Camisa Negra - Juanes",
          "Mi Gente - J Balvin",
          "Hawái - Maluma",
          "Tití Me Preguntó - Bad Bunny",
          "Tacones Rojos - Sebastián Yatra",
          "Todo de Ti - Rauw Alejandro",
          "Devuélveme a mi chica - Hombres G",
          "Soldadito Marinero - Fito & Fitipaldis",
          "La Chica de Ayer - Nacha Pop",
          "A Quién Le Importa - Alaska y Dinarama",
          "Cien Gaviotas - Duncan Dhu",
          "Princesas - Pereza",
          "Carolina - M-Clan",
          "Ave María - David Bisbal",
          "El Mismo Sol - Álvaro Soler",
          "Calma - Pedro Capó",
          "Con Altura - Rosalía",
          "Ni Una Sola Palabra - Paulina Rubio",
          "Amante Bandido - Miguel Bosé",
          "Salta - Tequila",
          "Clavado en un bar - Maná",
          "Flaca - Andrés Calamaro",
          "Guantanamera - Celia Cruz",
          "Oye Cómo Va - Santana",
          "La Gozadera - Gente de Zona",
        ],

        // Robust parsing of songs/words supporting ;; or newlines or commas
        parseWordsList: function (text) {
          "use strict";
          if (!text) return [];
          var raw = [];
          if (text.indexOf(";;") !== -1) {
            raw = text.split(";;");
          } else if (text.indexOf("\n") !== -1) {
            raw = text.split("\n");
          } else if (text.indexOf(",") !== -1) {
            raw = text.split(",");
          } else {
            raw = [text];
          }
          var result = [];
          for (var i = 0; i < raw.length; i += 1) {
            var item = raw[i].trim();
            if (item.length > 0 && item !== "...") {
              result.push(item);
            }
          }
          return result;
        },

        escapeHTML: function (str) {
          "use strict";
          if (!str) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        },

        newlineToBR: function (str) {
          "use strict";
          if (!str) return "";
          return str.replace(/\n/g, "<br>");
        },

        // Compute a lighter solid shade of a given hex color
        lightenColor: function (hex, factor) {
          "use strict";
          if (!hex) hex = "#4f46e5";
          hex = String(hex).trim().replace("#", "");
          if (hex.length === 3) {
            hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
          }
          if (hex.length !== 6) {
            return "#e0e7ff";
          }
          var r = parseInt(hex.substring(0, 2), 16);
          var g = parseInt(hex.substring(2, 4), 16);
          var b = parseInt(hex.substring(4, 6), 16);
          if (isNaN(r) || isNaN(g) || isNaN(b)) {
            return "#e0e7ff";
          }
          var f = typeof factor === "number" ? factor : 0.65;
          var newR = Math.round(r + (255 - r) * f);
          var newG = Math.round(g + (255 - g) * f);
          var newB = Math.round(b + (255 - b) * f);

          var toHex = function (c) {
            var h = Math.min(255, Math.max(0, c)).toString(16);
            return h.length === 1 ? "0" + h : h;
          };
          return "#" + toHex(newR) + toHex(newG) + toHex(newB);
        },

        // Update the live counter indicating how many songs are required vs provided
        updateWordCount: function () {
          "use strict";
          var words = bingoGenerator.parseWordsList($("#words").val());
          var width = parseInt($("#width").val(), 10) || 5;
          var height = parseInt($("#height").val(), 10) || 5;
          var isSpanish = $("#spanishBingo").is(":checked");
          var needed = (isSpanish && width > 1) ? (width - 1) * height : width * height;

          var $badge = $("#wordCountBadge");
          if (words.length >= needed) {
            $badge.removeClass("invalid").addClass("valid");
            $badge.html(
              "<span>✅ <strong>" +
                words.length +
                " canciones</strong> ingresadas</span><span>Se requieren " +
                needed +
                " por cartón (" +
                (isSpanish && width > 1
                  ? (width - 1) + " rellenas + 1 en blanco por fila"
                  : width + " por fila") +
                ")</span>"
            );
          } else {
            $badge.removeClass("valid").addClass("invalid");
            $badge.html(
              "<span>⚠️ <strong>" +
                words.length +
                " canciones</strong> ingresadas</span><span>Faltan " +
                (needed - words.length) +
                " canciones (cada cartón requiere " +
                needed +
                ")</span>"
            );
          }
        },

        // Render a single bingo card
        bingoCard: function (title, width, height, wordsList, isSpanishBingo, cardNumber) {
          "use strict";
          var i, j, output;

          // Number of non-blank playable squares on this card
          var neededPerCard =
            isSpanishBingo && width > 1 ? (width - 1) * height : width * height;

          // Pick random words for this card from available words without replacement
          var pool = wordsList.slice();
          var spaces = [];
          for (i = 0; i < neededPerCard; i += 1) {
            if (pool.length === 0) {
              pool = wordsList.slice();
            }
            var randIndex = Math.floor(Math.random() * pool.length);
            spaces.push(pool.splice(randIndex, 1)[0]);
          }

          var color = $("#headerColor").val() || "#000000";
          var blankColor = bingoGenerator.lightenColor(color, 0.65);
          var titleFont = $("#titleFont").val() || "Outfit";
          var bodyFont = $("#bodyFont").val() || "Outfit";
          var safeTitle = bingoGenerator.escapeHTML(title);

          output = '<div class="card-container">';
          output += '<div class="card-wrapper">';
          output += '<table style="font-family: \'' + bodyFont + '\', sans-serif;">';
          output +=
            '<thead><tr><th colspan="' +
            width +
            '" style="background-color: ' +
            color +
            "; font-family: '" +
            titleFont +
            '\', sans-serif;">';
          output += '<div class="th-container">';
          output += '<span class="th-title-text">' + safeTitle + "</span>";
          if (cardNumber !== undefined) {
            output += '<span class="th-card-badge">Cartón #' + cardNumber + "</span>";
          }
          output += "</div></th></tr></thead>";
          output += "<tbody>";

          var prevBlankCol = -1;
          for (i = 0; i < height; i += 1) {
            // Spanish Bingo: one random square in each row is going to be blank
            var blankCol = -1;
            if (isSpanishBingo && width > 1) {
              blankCol = Math.floor(Math.random() * width);
              // Avoid consecutive rows having the blank in the exact same column when width > 2
              if (width > 2 && blankCol === prevBlankCol) {
                blankCol = (blankCol + 1 + Math.floor(Math.random() * (width - 1))) % width;
              }
              prevBlankCol = blankCol;
            }

            output += "<tr>";
            for (j = 0; j < width; j += 1) {
              if (isSpanishBingo && j === blankCol) {
                // Blank square for Spanish Bingo style: solid color a few shades lighter than header
                output +=
                  '<td class="blank-square" style="background-color: ' +
                  blankColor +
                  ';" title="Casilla en blanco">&nbsp;</td>';
              } else {
                var rawWord = spaces.shift() || "";
                var cellContent = bingoGenerator.newlineToBR(
                  bingoGenerator.escapeHTML(rawWord)
                );
                output +=
                  '<td class="bingo-cell" tabindex="0">' + cellContent + "</td>";
              }
            }
            output += "</tr>";
          }
          output += "</tbody></table>";
          if (bingoGenerator.bgImageData) {
            var op = ($("#bgOpacity").val() || 15) / 100;
            output +=
              '<img class="card-watermark" src="' +
              bingoGenerator.bgImageData +
              '" alt="" style="opacity: ' +
              op +
              ';" />';
          }
          output += "</div></div>";
          $("#results").append(output);
        },

        // Generate Bingo Cards
        generate: function () {
          "use strict";
          var width = parseInt($("#width").val(), 10) || 5;
          var height = parseInt($("#height").val(), 10) || 5;
          var numCards = parseInt($("#number").val(), 10) || 1;
          var isSpanish = $("#spanishBingo").is(":checked");
          var words = bingoGenerator.parseWordsList($("#words").val());
          var neededPerCard = (isSpanish && width > 1) ? (width - 1) * height : width * height;

          // Check to make sure enough options are provided to fill the bingo card spaces
          if (words.length < neededPerCard) {
            alert(
              "Faltan canciones: has ingresado " +
                words.length +
                " canciones y cada cartón necesita " +
                neededPerCard +
                (isSpanish && width > 1
                  ? " (" + (width - 1) + " por fila + 1 casilla en blanco por fila)."
                  : ".")
            );
            return false;
          }

          // Clear any previous results
          $("#results").html("");

          // Loop over number of cards requested
          var title = $("#title").val();
          for (var i = 0; i < numCards; i += 1) {
            bingoGenerator.bingoCard(
              title,
              width,
              height,
              words,
              isSpanish,
              i + 1
            );
            if (i < numCards - 1) {
              $("#results").append('<div class="break"></div>');
            }
          }

          // Initialize dauber on generated cards
          dauber.init();
          $("#actionGroup").show();

          // Scroll to results
          var resultsElem = document.getElementById("results");
          if (resultsElem) {
            resultsElem.scrollIntoView({ behavior: "smooth" });
          }
          return true;
        },

        // Replace + with spaces, <> with entities, and URL-decode &/,:;+=?%$@
        urlUnencode: function (str) {
          "use strict";
          if (!str) return "";
          return decodeURI(str)
            .replace(/</g, "&lt;")
            .replace(/\+/g, " ")
            .replace(/%24/g, "$")
            .replace(/%25/g, "%")
            .replace(/%26/g, "&")
            .replace(/%2B/g, "+")
            .replace(/%2C/g, ",")
            .replace(/%2F/g, "/")
            .replace(/%23/g, "#")
            .replace(/%3A/g, ":")
            .replace(/%3B/g, ";")
            .replace(/%3C/g, "&lt;")
            .replace(/%3D/g, "=")
            .replace(/%3F/g, "?")
            .replace(/%40/g, "@");
        },

        parseQS: function () {
          "use strict";
          var qsArray, json, i, kv, key, val;
          qsArray = location.search.slice(1).split("&");
          json = {};
          for (i = 0; i < qsArray.length; i += 1) {
            if (!qsArray[i]) continue;
            kv = qsArray[i].split("=");
            key = kv[0];
            val = kv.length === 1 ? key : kv[1];
            json[key] = val;
          }
          return json;
        },

        checkQS: function () {
          "use strict";
          var qs = bingoGenerator.parseQS();
          if (qs.title !== undefined || qs.words !== undefined) {
            if (qs.title !== undefined) {
              $("#title").val(bingoGenerator.urlUnencode(qs.title));
            }
            if (qs.words !== undefined) {
              $("#words").val(bingoGenerator.urlUnencode(qs.words));
            }
            if (qs.headerColor !== undefined) {
              $("#headerColor").val(bingoGenerator.urlUnencode(qs.headerColor));
            }
            if (qs.titleFont !== undefined) {
              $("#titleFont").val(bingoGenerator.urlUnencode(qs.titleFont));
            }
            if (qs.bodyFont !== undefined) {
              $("#bodyFont").val(bingoGenerator.urlUnencode(qs.bodyFont));
            }
            if (qs.width !== undefined) {
              $("#width").val(qs.width);
            }
            if (qs.height !== undefined) {
              $("#height").val(qs.height);
            }
            if (qs.number !== undefined) {
              $("#number").val(qs.number);
            }
            if (qs.spanishBingo !== undefined) {
              $("#spanishBingo").prop(
                "checked",
                qs.spanishBingo === "true" ||
                  qs.spanishBingo === "1" ||
                  qs.spanishBingo === "on"
              );
            }
            bingoGenerator.updateWordCount();
            bingoGenerator.generate();
            return true;
          }
          return false;
        },

        // Download multi-card PDF
        downloadPdf: function (button) {
          "use strict";
          var cards = document.querySelectorAll("#results .card-container");
          if (!cards || cards.length === 0) {
            alert("No hay cartones generados para descargar.");
            return;
          }
          var opt = {
            margin: 10,
            filename: "cartones_bingo_espanol.pdf",
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, scrollX: 0, scrollY: 0, useCORS: true },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          };
          button.disabled = true;
          button.textContent = "Generando PDF...";

          document.fonts.ready
            .then(function () {
              var worker = html2pdf().set(opt).from(cards[0]).toPdf();
              var i;
              for (i = 1; i < cards.length; i += 1) {
                worker = worker
                  .get("pdf")
                  .then(function (pdf) {
                    pdf.addPage();
                  })
                  .from(cards[i])
                  .toContainer()
                  .toCanvas()
                  .toPdf();
              }
              return worker.save();
            })
            .then(function () {
              button.disabled = false;
              button.textContent = "📄 Descargar PDF";
            })
            .catch(function (err) {
              console.error("Error al generar PDF:", err);
              button.disabled = false;
              button.textContent = "📄 Descargar PDF";
              alert(
                "Hubo un error al generar el PDF. Por favor, inténtalo de nuevo."
              );
            });
        },

        fonts: [
          "Outfit",
          "Poppins",
          "Montserrat",
          "Nunito",
          "Fredoka",
          "Playfair Display",
          "Roboto Slab",
          "Caveat",
          "Patrick Hand",
          "Permanent Marker",
          "Lobster",
          "Pacifico",
          "Bangers",
          "Bebas Neue",
          "Righteous",
        ],

        icons: "🎵 🎶 🎤 🎧 🎸 🎹 🥁 🎷 🎺 🎻 💿 📻 ⭐ ✨ 🎉 🎈 🏆 ❤️ 🎄 🎃".split(
          " "
        ),

        initControls: function () {
          "use strict";
          bingoGenerator.fonts.forEach(function (font) {
            $("#titleFont, #bodyFont").append(
              $("<option>").val(font).text(font).css("font-family", font)
            );
          });

          bingoGenerator.icons.forEach(function (icon) {
            $("#iconBank").append(
              $('<button type="button">')
                .text(icon)
                .attr("title", "Añadir " + icon)
            );
          });

          // Insert the icon at cursor in the title field
          $("#iconBank").on("click", "button", function () {
            var input = document.getElementById("title");
            var start = input.selectionStart;
            var end = input.selectionEnd;
            var icon = $(this).text();
            input.value =
              input.value.slice(0, start) + icon + input.value.slice(end);
            input.focus();
            input.setSelectionRange(start + icon.length, start + icon.length);
          });

          // Load sample songs button
          $("#loadSampleSongsBtn").on("click", function (e) {
            e.preventDefault();
            $("#words").val(bingoGenerator.sampleSongs.join(";; "));
            bingoGenerator.updateWordCount();
          });

          // Realtime word count listener
          $("#words, #width, #height, #spanishBingo").on(
            "input change",
            function () {
              bingoGenerator.updateWordCount();
            }
          );

          // Clear daub marks
          $("#clearDaubsBtn").on("click", function () {
            dauber.clearAll();
          });

          // Download PDF button
          $("#downloadPdfBtn").on("click", function (e) {
            e.preventDefault();
            bingoGenerator.downloadPdf(this);
          });

          // Background image uploader (custom PNG)
          $("#bgImageFile").on("change", function (e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (evt) {
              bingoGenerator.bgImageData = evt.target.result;
              bingoGenerator.bgImageName = file.name;
              $("#bgNameText").text(file.name);
              $("#bgPreviewBadge").show();
              $(".card-watermark").attr("src", bingoGenerator.bgImageData);
              if ($("#results .card-container").length > 0) {
                bingoGenerator.generate();
              }
            };
            reader.readAsDataURL(file);
          });

          // Preset spiderweb button
          $("#useSpiderwebBtn").on("click", function () {
            bingoGenerator.bgImageData = "/spiderweb.svg";
            bingoGenerator.bgImageName = "Telaraña (Halloween)";
            $("#bgNameText").text(bingoGenerator.bgImageName);
            $("#bgPreviewBadge").show();
            if ($("#results .card-container").length > 0) {
              bingoGenerator.generate();
            }
          });

          // Clear background button
          $("#clearBgBtn").on("click", function () {
            bingoGenerator.bgImageData = null;
            bingoGenerator.bgImageName = "Ninguno";
            $("#bgNameText").text("Ninguno");
            $("#bgPreviewBadge").hide();
            $("#bgImageFile").val("");
            if ($("#results .card-container").length > 0) {
              bingoGenerator.generate();
            }
          });

          // Background opacity slider
          $("#bgOpacity").on("input change", function () {
            var val = $(this).val();
            $("#bgOpacityVal").text(val + "%");
            $(".card-watermark").css("opacity", val / 100);
          });

          // Form submission via JavaScript for seamless card generation without reload
          $("form").on("submit", function (e) {
            e.preventDefault();
            bingoGenerator.generate();
          });
        },
      };

      $(document).ready(function () {
        bingoGenerator.initControls();
        // Populate default songs if words is default placeholder
        if ($("#words").val() === "..." || !$("#words").val().trim()) {
          $("#words").val(bingoGenerator.sampleSongs.join(";; "));
        }
        bingoGenerator.updateWordCount();
        if (!bingoGenerator.checkQS()) {
          bingoGenerator.generate();
        }
      });
    </script>
  </head>
  <body>
    <div class="app-header">
      <h1>Crea tu propio Bingo</h1>
    </div>

    <form action="#results" method="get">
      <fieldset>
        <legend>🎨 Detalles del bingo</legend>
        <label for="title">Título del cartón:</label>
        <input
          type="text"
          name="title"
          id="title"
          value="🎃 Bingo Musical  🎃"
        />
        <div class="icon-bank" id="iconBank"></div>

        <div class="font-row">
          <label for="titleFont"
            >Fuente del título:
            <select name="titleFont" id="titleFont"></select>
          </label>
          <label for="bodyFont"
            >Fuente de las casillas:
            <select name="bodyFont" id="bodyFont"></select>
          </label>
        </div>

        <label for="headerColor">Color de cabecera:</label>
        <input
          type="color"
          name="headerColor"
          id="headerColor"
          value="#000000"
        />

        <div class="spanish-banner">
          <label class="spanish-checkbox-row" for="spanishBingo">
            <input
              type="checkbox"
              name="spanishBingo"
              id="spanishBingo"
              checked
            />
            <div>
              <span class="spanish-text-title"
                >Modo bingo español (1 casilla en blanco por fila)</span
              >
              <span class="spanish-text-desc"
                >Al igual que en los cartones tradicionales españoles, cada fila tendrá exactamente una casilla en blanco aleatoria.</span
              >
            </div>
          </label>
        </div>

        <div class="bg-section">
          <label class="bg-section-title">🕸️ Imagen de fondo del cartón (Marca de agua):</label>
          <div class="bg-controls-row">
            <label for="bgImageFile" class="bg-upload-btn">
              📁 Subir archivo PNG
            </label>
            <input type="file" id="bgImageFile" accept="image/png, image/*" style="display: none;" />
            <button type="button" class="preset-small-btn" id="useSpiderwebBtn">
              🕸️ Telaraña (Halloween)
            </button>
            <button type="button" class="preset-small-btn btn-remove-bg" id="clearBgBtn">
              ✕ Sin fondo
            </button>
          </div>
          <div class="bg-opacity-row">
            <label for="bgOpacity">Opacidad del fondo: <strong id="bgOpacityVal">15%</strong></label>
            <input type="range" id="bgOpacity" min="5" max="50" value="15" step="1" />
          </div>
          <div id="bgPreviewBadge" class="bg-preview-badge">
            <span>Fondo activo: <strong id="bgNameText">Telaraña (Halloween)</strong></span>
          </div>
        </div>

        <div class="textarea-header">
          <label for="words" style="margin: 0"
            >Listado de canciones o elementos (separados por <code>;;</code>):</label
          >
          <button
            type="button"
            id="loadSampleSongsBtn"
            class="sample-link"
            title="Cargar lista de canciones de muestra"
          >
            ↻ Cargar canciones de ejemplo
          </button>
        </div>
        <textarea
          cols="60"
          rows="6"
          name="words"
          id="words"
          placeholder="Canción 1;; Canción 2;; Canción 3..."
        ></textarea>

        <div id="wordCountBadge" class="word-count-badge"></div>


        <div class="dimension-row">
          <label for="width"
            >Número de columnas (ancho):
            <input
              type="number"
              min="2"
              max="10"
              name="width"
              id="width"
              value="5"
            />
          </label>
          <label for="height"
            >Número de filas (alto):
            <input
              type="number"
              min="1"
              max="10"
              name="height"
              id="height"
              value="5"
            />
          </label>
        </div>

        <label for="number"
          >Número de cartones a generar:
          <input
            type="number"
            min="1"
            max="100"
            name="number"
            id="number"
            value="10"
          />
        </label>
      </fieldset>

      <button type="submit" class="btn-primary" id="generateBtn">
        🎲 Generar cartones de bingo
      </button>

      <div class="btn-group" id="actionGroup" style="display: none">
        <button type="button" class="btn-secondary" id="downloadPdfBtn">
          📄 Descargar PDF
        </button>
        <button type="button" class="btn-secondary btn-outline" id="clearDaubsBtn">
          🧹 Limpiar tachones
        </button>
      </div>
    </form>

    <div id="results"></div>

    <div id="footer">
      Basado en el código de <a href="https://osric.com/">Chris Osric</a>
    </div>
  </body>
</html>
